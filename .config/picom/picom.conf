backend = "glx";
vsync = true;

shadow = false;
fading = false;

blur-method = "dual_kawase";
blur-strength = 6;
blur-background = false;

blur-background-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
];

blur-background-include = [
  "class_g = 'Alacritty'",
];

opacity-rule = [
  "85:class_g = 'Alacritty'",
];
